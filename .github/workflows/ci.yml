concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/setup@v3
      - name: run `pnpm run fmt:check`
        run: pnpm run fmt:check
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/setup@v3
      - name: run `pnpm run lint`
        run: pnpm run lint
  types:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/setup@v3
      - name: run `pnpm run type:check`
        run: pnpm run type:check
name: ci
on:
  pull_request:
  push:
    branches:
      - master
